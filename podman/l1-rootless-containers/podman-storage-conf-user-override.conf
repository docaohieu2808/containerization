# ~/.config/containers/storage.conf: per-user Podman storage configuration.
# Copy to ~/.config/containers/storage.conf to override the defaults.
# Reference: man containers-storage.conf
#
# The defaults already suit most machines: native overlay on kernel 5.13+ (no
# fuse-overlayfs needed), data under ~/.local/share/containers/storage.
# Uncomment only what you need.

[storage]
driver = "overlay"

# Move image/container data, e.g. when $HOME is small or on a slow filesystem:
# graphroot = "/fast-disk/containers/storage"

[storage.options.overlay]
# Do not fail when chown to a uid outside your subuid range is requested while
# extracting images (some images contain such files):
ignore_chown_errors = "true"
