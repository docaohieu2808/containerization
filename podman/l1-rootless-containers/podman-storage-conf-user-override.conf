# ~/.config/containers/storage.conf — per-user Podman storage configuration
# Demonstrates: override default rootless storage driver and location
# Place this file at: ~/.config/containers/storage.conf
#
# Full reference: man 5 containers-storage.conf

[storage]
  # overlay is the default and recommended driver for rootless Podman
  driver = "overlay"

  # Custom storage root (default: ~/.local/share/containers/storage)
  # Useful if home directory is on a slow/small filesystem
  # graphroot = "/fast-disk/containers/storage"

  # Temporary storage (default: /run/user/$UID/containers)
  runroot = "/run/user/1000/containers"

[storage.options]
  # Mount program: fuse-overlayfs (slower but works everywhere)
  # or native kernel overlay (requires kernel 5.13+ with user_xattr or unprivileged userns)
  mount_program = "/usr/bin/fuse-overlayfs"

  # Size of the overlay storage (leave empty for unlimited)
  # size = "20G"

[storage.options.overlay]
  # Force use of native kernel overlay (comment out mount_program above first)
  # mount_program = ""

  # Ignore chown errors when using native overlay in rootless mode
  ignore_chown_errors = "true"
