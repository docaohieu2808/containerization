# L-max: `podman kube play` runs Kubernetes YAML with Podman, no cluster needed.
# Podman supports Pod, Deployment, PersistentVolumeClaim, ConfigMap, Secret and a
# few more kinds. Handy for trying a manifest locally before it goes to a cluster.
#
# Run:      podman kube play nginx-pod-kubernetes-manifest.yaml
# Teardown: podman kube down nginx-pod-kubernetes-manifest.yaml
apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo-pod
  labels:
    app: nginx-demo
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:1.30.6-alpine3.24-slim
      ports:
        - containerPort: 80
          hostPort: 18085
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html
          readOnly: true

    # Sidecar: shares the pod's network namespace, so nginx is on its localhost.
    - name: log-watcher
      image: docker.io/library/alpine:3.24.3
      command:
        - sh
        - -c
        - while true; do wget -q -O /dev/null http://127.0.0.1:80/ && echo "nginx ok"; sleep 5; done

  volumes:
    - name: html-content
      configMap:
        name: nginx-html-content
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html-content
data:
  index.html: |
    <!DOCTYPE html>
    <html><body>
    <h1>Hello from podman kube play!</h1>
    <p>This pod is running via Podman, not Kubernetes.</p>
    </body></html>
