# MAX: podman kube play — run Kubernetes YAML natively with Podman (no K8s cluster needed)
# Demonstrates: K8s Pod spec run locally via Podman
#
# Run:     podman kube play nginx-pod-kubernetes-manifest.yaml
# Teardown: podman kube down nginx-pod-kubernetes-manifest.yaml
#
# podman kube play supports: Pod, Deployment, PersistentVolumeClaim, ConfigMap, Secret
# Useful for: local dev without K8s, testing manifests before cluster deploy

apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo-pod
  labels:
    app: nginx-demo
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
          hostPort: 8080
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html
          readOnly: true

    # Sidecar: shares network namespace with nginx (same pod)
    - name: log-watcher
      image: alpine:3.19
      command: ["sh", "-c", "while true; do wget -qO- http://localhost:80 > /dev/null && echo 'nginx ok'; sleep 10; done"]

  volumes:
    - name: html-content
      configMap:
        name: nginx-html-content

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html-content
data:
  index.html: |
    <!DOCTYPE html>
    <html><body>
    <h1>Hello from podman kube play!</h1>
    <p>This pod is running via Podman, not Kubernetes.</p>
    </body></html>
