# L-max: builder.toml. A builder is an image that bundles everything `pack build`
# needs: a pinned lifecycle, the buildpacks, their detection order, and the build
# and run images. Publishing one builder gives every team the same reproducible
# toolchain.
#
# Create: pack builder create myorg/custom-builder:latest --config custom-builder-descriptor.toml
# Use:    pack build myapp --builder myorg/custom-builder:latest

description = "MyOrg builder: Node.js, Python and Go on Ubuntu 24.04"

# Buildpacks included in the builder. Composite Paketo buildpacks pull in the
# buildpacks they depend on. Releases: https://github.com/paketo-buildpacks
[[buildpacks]]
uri = "docker://gcr.io/paketo-buildpacks/nodejs:10.14.1"

[[buildpacks]]
uri = "docker://gcr.io/paketo-buildpacks/python:2.66.0"

[[buildpacks]]
uri = "docker://gcr.io/paketo-buildpacks/go:4.23.1"

# Detection order: the first group whose buildpacks all detect wins. (A version
# is only needed if the builder holds several versions of the same buildpack;
# "latest" is not a valid version.)
[[order]]
[[order.group]]
id = "paketo-buildpacks/nodejs"

[[order]]
[[order.group]]
id = "paketo-buildpacks/python"

[[order]]
[[order.group]]
id = "paketo-buildpacks/go"

# Pinned lifecycle: https://github.com/buildpacks/lifecycle/releases
[lifecycle]
version = "0.21.26"

# Build image: has compilers and build tools. Run image: minimal, what ships.
[build]
image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.152"

[run]
[[run.images]]
image = "docker.io/paketobuildpacks/ubuntu-noble-run:0.0.152"

# [[targets]] replaces the deprecated [stack] table.
[[targets]]
os = "linux"
arch = "amd64"
