# L2: Custom buildpack descriptor — buildpack.toml
# Required file at the root of every buildpack
# Defines: buildpack ID, version, supported stacks

[buildpack]
  id      = "myorg/custom-node"
  version = "0.1.0"
  name    = "MyOrg Custom Node.js Buildpack"
  homepage = "https://github.com/myorg/custom-node-buildpack"

# Stacks this buildpack supports
# io.buildpacks.stacks.bionic = Ubuntu 18.04 (deprecated)
# io.buildpacks.stacks.jammy  = Ubuntu 22.04 (Paketo default)
# *                            = any stack
[[stacks]]
  id = "io.buildpacks.stacks.jammy"

[[stacks]]
  id = "*"
