# L5: Advanced Docker Compose
# Demonstrates:
#   - profiles (dev / test / prod) — start only relevant services per environment
#   - depends_on with condition: service_healthy — wait for real readiness
#   - healthcheck on each service
#   - secrets (file-based, not env vars)
#   - configs (inject config files without baking into image)
#   - deploy limits (CPU + memory) for prod-like resource constraints
#
# Usage:
#   Dev:  docker compose --profile dev up
#   Test: docker compose --profile test up
#   Prod: docker compose --profile prod up

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    profiles: [dev, test, prod]
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: appdb
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── Redis cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    profiles: [dev, prod]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── Node app (dev profile) ───────────────────────────────────────────────────
  node-app-dev:
    build:
      context: ../..
      dockerfile: docker/l1-basic-dockerfile/node-app-basic.Dockerfile
    profiles: [dev]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: app_config
        target: /app/config.json

  # ── Node app (prod profile) ───────────────────────────────────────────────────
  node-app-prod:
    build:
      context: ../..
      dockerfile: docker/l2-multi-stage-builds/node-app-multistage.Dockerfile
    profiles: [prod]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    secrets:
      - db_password

  # ── Test runner (test profile only) ─────────────────────────────────────────
  test-runner:
    image: node:20-alpine
    profiles: [test]
    command: sh -c "echo 'Running tests...' && sleep 2 && echo 'Tests passed'"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

secrets:
  db_password:
    file: ./secrets/db-password.txt  # create this file locally, never commit it

configs:
  app_config:
    file: ./configs/app-config.json
