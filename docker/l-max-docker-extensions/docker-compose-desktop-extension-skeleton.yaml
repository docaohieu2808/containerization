# MAX: Docker Desktop Extension skeleton
# Demonstrates: minimal structure for a Docker Desktop UI extension
# Extensions run as a privileged container inside Docker Desktop
#
# Build extension: docker build -t myorg/my-extension:latest .
# Install:         docker extension install myorg/my-extension:latest
# Dev mode:        docker extension dev myorg/my-extension:latest

services:
  # The extension backend (optional — for extensions that need a backend service)
  backend:
    image: myorg/my-extension-backend:latest
    build:
      context: ./backend
      dockerfile: backend-api-server.Dockerfile
    labels:
      com.docker.desktop.extension: "true"
      com.docker.desktop.extension.api.version: ">=0.3.3"

  # Extensions that only have a UI don't need a backend service
  # The UI is served from the extension image itself via metadata.json
